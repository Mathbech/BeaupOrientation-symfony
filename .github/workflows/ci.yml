name: Beaup'orientation CI

on:
  push:
    branches: [ dev, preprod, prod ]
  pull_request:
    branches: [ dev, preprod, prod ]

jobs:
  ci:
    name: Build & Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: 'test'
      APP_ENV_NAME: 'test'
      APP_DEBUG: 1
      APP_SECRET: '$ecretf0rt3st'
      SYMFONY_DEPRECATIONS_HELPER: disabled
      SENDER_EMAIL_ADDRESS: 'no-reply@beauporientation.fr'
      DATABASE_URL: 'mysql://app:password@127.0.0.1:3318/app'
      JWT_PASSPHRASE: 'NRyT23bmBpvnjKQL'
      JWT_TOKEN_TTL: 31536000
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      BASE_URL: ''
      MAILER_DSN: 'null://null'
      MAILER_DSN_AWS_SES: 'null://null'

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: password
          TZ: Europe/Paris
        ports:
          - 3318:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: composer:v2, flex, pcov, ssh2
          coverage: pcov

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install vendors
        run: composer install --no-progress --ansi --no-scripts

      - name: Validate composer
        run: composer validate --no-check-lock

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./.package-lock.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # - name: Npm Install
      #   run: npm install

      # - name: Npm Build
      #   run: npm run build

