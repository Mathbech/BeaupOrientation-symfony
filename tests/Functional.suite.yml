# Codeception Test Suite Configuration
#
# Suite for functional tests
# Emulate web requests and make application process them

actor: FunctionalTester
modules:
    enabled:
        - Asserts
        - Symfony:
              app_path: 'src'
              environment: 'test'
        - Doctrine:
             depends: Symfony
             cleanup: true
        - Db:
             dsn: 'mysql:host=Beauporientation-database;dbname=app_test'
             user: 'root'
             password: 'root'
