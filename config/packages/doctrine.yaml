doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '%env(resolve:DATABASE_VERSION)%'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            geography_point: LongitudeOne\Spatial\DBAL\Types\Geography\PointType
            geometry_point:      LongitudeOne\Spatial\DBAL\Types\Geometry\PointType
            geometry_linestring: LongitudeOne\Spatial\DBAL\Types\Geometry\LineStringType

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false
        dql:
            numeric_functions:
                #Declare functions returning a numeric value
                # Gardez les fonctions numériques essentielles (ajoutez ST_Distance si besoin)
                st_distance: LongitudeOne\Spatial\ORM\Query\AST\Functions\Standard\StDistance
                #A good practice is to prefix functions with ST when they are issue from the Standard directory
                st_area: LongitudeOne\Spatial\ORM\Query\AST\Functions\Standard\StArea
                st_x: LongitudeOne\Spatial\ORM\Query\AST\Functions\Standard\StX
                st_y: LongitudeOne\Spatial\ORM\Query\AST\Functions\Standard\StY
                st_asgeojson: LongitudeOne\Spatial\ORM\Query\AST\Functions\Standard\StAsGeoJson
            string_functions:
                st_asgeojson: LongitudeOne\Spatial\ORM\Query\AST\Functions\Standard\StAsGeoJson
                group_concat: DoctrineExtensions\Query\Mysql\GroupConcat

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
            use_savepoints: false

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
